{% extends 'gocart/base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="card shadow-lg p-4 rounded-4" style="max-width: 600px; margin: 0 auto;">
    <h2 class="text-center mb-4 text-primary">Complete Your Profile (Driver)</h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary btn-lg">Submit Profile</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
