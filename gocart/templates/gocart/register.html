{% extends 'gocart/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 95vh;">
  <div class="card shadow-lg rounded-4 p-4 w-100" style="max-width: 500px;">
    <h2 class="text-center text-success mb-4">Create Your GoCart Account</h2>

    <form method="POST" enctype="multipart/form-data" novalidate>
      {% csrf_token %}

      <!-- Role Selection -->
      <div class="form-floating mb-3">
        <select class="form-select" id="role" name="role" required>
          <option value="" selected disabled>Choose your role</option>
          <option value="student">👤 User</option>
          <option value="driver">🚗 Driver</option>
        </select>
        <label for="role">Register as</label>
      </div>

      <!-- Username -->
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
        <label for="username">Username</label>
      </div>

      <!-- Email -->
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" name="email" placeholder="email@example.com" required>
        <label for="email">Email address</label>
      </div>

      <!-- Password -->
      <div class="form-floating mb-3 position-relative">
        <input type="password" class="form-control" id="password1" name="password1" placeholder="Password" required>
        <label for="password1">Password</label>
      </div>

      <!-- Confirm Password -->
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm Password" required>
        <label for="password2">Confirm Password</label>
      </div>

      <!-- Submit -->
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-success btn-lg">Register</button>
      </div>

      <!-- Login redirect -->
      <div class="text-center mt-3">
        <p class="text-muted mb-0">Already have an account?
          <a href="{% url 'login' %}" class="text-decoration-none fw-semibold text-primary">Login here</a>
        </p>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_styles %}
<style>
  body {
    background: linear-gradient(120deg, #e0f7fa, #e1bee7);
    font-family: 'Poppins', sans-serif;
  }

  .card {
    background: #ffffff;
    border: none;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
  }

  .form-floating > .form-control:focus {
    border-color: #4CAF50;
    box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
  }

  .btn-success {
    background-color: #4CAF50;
    border-color: #4CAF50;
  }

  .btn-success:hover {
    background-color: #45a049;
  }

  select.form-select {
    padding-top: 1.625rem;
    padding-bottom: 0.625rem;
  }

  label[for="role"] {
    font-weight: 500;
  }
</style>
{% endblock %}
