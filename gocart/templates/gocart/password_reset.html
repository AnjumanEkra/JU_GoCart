{% extends 'gocart/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="height: 95vh;">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4 text-primary">Reset Password</h3>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="email" class="form-label">Enter your Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Send Reset Link</button>
    </form>
  </div>
</div>
{% endblock %}
