{% extends 'gocart/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 90vh;">
  <div class="card shadow-lg p-5 border-danger-subtle rounded-4" style="max-width: 500px; width: 100%; animation: fadeIn 0.5s ease-in-out;">
    
    <!-- Header -->
    <div class="text-center mb-4">
      <div class="text-danger" style="font-size: 2.8rem;">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <h3 class="mt-2 text-danger fw-bold">Are You Sure?</h3>
      <p class="text-muted">This action <strong>cannot be undone</strong>. All your profile, bookings, and data will be deleted permanently.</p>
    </div>

    <!-- Form -->
    <form method="POST" autocomplete="off">
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Enter your password to confirm:</label>
        <input type="password" name="password" class="form-control border-danger" id="password" placeholder="••••••••••" required>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="{% url 'profile' %}" class="btn btn-outline-secondary px-4">
          <i class="fas fa-arrow-left me-1"></i> Cancel
        </a>
        <button type="submit" class="btn btn-danger px-4">
          <i class="fas fa-trash-alt me-1"></i> Delete Account
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}

{% block extra_styles %}
<style>
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .form-control:focus {
    border-color: #dc3545;
    box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
  }

  .btn-danger {
    background-color: #dc3545;
    border-color: #dc3545;
  }

  .btn-danger:hover {
    background-color: #c82333;
    border-color: #bd2130;
  }

  .btn-outline-secondary:hover {
    background-color: #e9ecef;
  }
</style>
{% endblock %}
