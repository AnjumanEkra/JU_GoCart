{% extends 'gocart/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 90vh;">
  <div class="card shadow-lg rounded-4 p-4 w-100" style="max-width: 450px; background: #ffffff;">
    <div class="text-center mb-4">
      <i class="fas fa-lock fa-3x text-success mb-2"></i>
      <h3 class="text-dark">Reset Your Password</h3>
      <p class="text-muted mb-0" style="font-size: 0.95rem;">Create a strong password to secure your account.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="new_password1" class="form-label">New Password</label>
        <input type="password" name="new_password1" class="form-control" id="new_password1" required>
      </div>

      <div class="mb-3">
        <label for="new_password2" class="form-label">Confirm New Password</label>
        <input type="password" name="new_password2" class="form-control" id="new_password2" required>
      </div>

      <button type="submit" class="btn btn-success w-100 mt-3">🔐 Update Password</button>
    </form>

    <div class="text-center mt-4">
      <a href="{% url 'login' %}" class="text-decoration-none text-primary">
        <i class="fas fa-arrow-left"></i> Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_styles %}
<style>
  body {
    background: linear-gradient(135deg, #e0f7fa, #e6ffe6);
    font-family: 'Poppins', sans-serif;
  }

  .card {
    border-radius: 20px;
  }

  .form-control:focus {
    border-color: #28a745;
    box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
  }

  .btn-success {
    background-color: #28a745;
    border-color: #28a745;
  }

  .btn-success:hover {
    background-color: #218838;
    border-color: #1e7e34;
  }
</style>
{% endblock %}
