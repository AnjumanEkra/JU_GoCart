{% extends 'gocart/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="height: 100vh; margin-top: 200px; margin-bottom: 110px;">
  <div class="card shadow-lg p-4 rounded-4" style="max-width: 600px; margin: 0 auto;">
    <h2 class="text-center mb-4 {% if request.user.role == 'driver' %}text-primary{% else %}text-success{% endif %}">
      Complete Your Profile ({{ request.user.role|title }})
    </h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label for="first_name" class="form-label">First Name</label>
        <input type="text" name="first_name" id="first_name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="last_name" class="form-label">Last Name</label>
        <input type="text" name="last_name" id="last_name" class="form-control" required>
      </div>
      
      <div class="mb-3">
        <label for="gender" class="form-label">Gender</label>
        <select name="gender" id="gender" class="form-control" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" name="dob" id="dob" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="present_address" class="form-label">Present Address</label>
        <input type="text" name="present_address" id="present_address" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="postal_code" class="form-label">Postal Code</label>
        <input type="text" name="postal_code" id="postal_code" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="home_district" class="form-label">Home District</label>
        <input type="text" name="home_district" id="home_district" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="nationality" class="form-label">Nationality</label>
        <input type="text" name="nationality" id="nationality" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="text" name="phone" id="phone" class="form-control" required>
      </div>

      {% if request.user.role == 'driver' %}
      <div class="mb-3">
        <label for="nid_card_no" class="form-label">NID Card Number</label>
        <input type="text" name="nid_card_no" id="nid_card_no" class="form-control" required>
      </div>
      {% endif %}

      <div class="mb-3">
        <label for="profile_picture" class="form-label">Upload Profile Picture</label>
        <input type="file" name="profile_picture" id="profile_picture" class="form-control">
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn {% if request.user.role == 'driver' %}btn-primary{% else %}btn-success{% endif %} btn-lg">
          Submit Profile
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
