{% extends 'gocart/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="height: 95vh;">
  <div class="login-container shadow-lg rounded-3 p-4 bg-white w-100" style="max-width: 420px;">
    <h2 class="text-center text-primary mb-4">Login to Go Cart</h2>

    {% if error_message %}
      <div class="alert alert-danger text-center fw-semibold" role="alert">
        {{ error_message }}
      </div>
    {% endif %}


    <form method="POST">
      {% csrf_token %}

      <!-- Role Selector -->
      <div class="mb-4">
        <label for="role" class="form-label fw-semibold">Login as</label>
        <div class="input-group">
          <span class="input-group-text bg-success text-white">
            <i class="fas fa-user-tag"></i>
          </span>
          <select name="role" id="role" class="form-select" required>
            <option value="" disabled selected>Select your role</option>
            <option value="student">👤 User</option>
            <option value="driver">🚗 Driver</option>
          </select>
        </div>
      </div>

      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" name="username" class="form-control" id="username" placeholder="Enter your username" required>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()" tabindex="-1">
            <i class="fas fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe" name="remember">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a href="{% url 'password_reset' %}" class="text-decoration-none text-primary fw-semibold">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-success w-100 mb-3">Login</button>

      <!-- Register -->
      <div class="text-center mt-2">
        <p class="mb-0">Don't have an account?
          <a href="{% url 'register' %}" class="text-primary fw-semibold">Register here</a>
        </p>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_styles %}
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #f4f6f9;
  }

  .login-container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  }

  .btn-success {
    background-color: #28a745;
    border-color: #28a745;
  }

  .btn-success:hover {
    background-color: #218838;
    border-color: #1e7e34;
  }

  .form-control:focus {
    border-color: #28a745;
    box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
  }

  .form-select:focus {
    border-color: #28a745;
    box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
  }
</style>
{% endblock %}

{% block extra_js %}
<script>
  function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>
{% endblock %}
